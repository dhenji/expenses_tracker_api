[project]
name = "expenses-tracker-api"
version = "0.1.0"
description = "API for an expense tracker application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
app = "expenses_tracker_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
