[project]
name = "expenses-tracker-api"
version = "0.1.0"
description = "API for an expense tracker application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.2",
]

[project.scripts]
app = "expenses_tracker_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
