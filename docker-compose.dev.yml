services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: runtime
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./src:/app/src
    environment:
      DB_PG_HOST: postgres
    env_file:
      - ./.env
    secrets:
      - pg_user_password
    command: >
      uvicorn
      expenses_tracker_api.main:app
      --host 0.0.0.0
      --port "${APP_PORT}"
      --reload
      --reload-dir /app/src/expenses_tracker_api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenses-net
  
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: test
    environment:
      DB_PG_HOST: postgres
    env_file:
      - ./.env
    secrets:
      - pg_user_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenses-net

  postgres:
    image: postgres:16
    container_name: pg-expenses-tracker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_user_password
      POSTGRES_DB: ${DB_PG_DB_NAME}
    env_file:
      - ./.env
    secrets:
      - pg_user_password
    volumes:
      - pg_exp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start-period: 10s
    networks:
      - expenses-net

  flyway:
    image: flyway/flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:${DB_PG_PORT}/${DB_PG_DB_NAME} 
      FLYWAY_USER: ${DB_PG_USER}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    entrypoint: ["/flyway-entrypoint.sh"]
    command: ["migrate"]
    secrets:
      - pg_user_password
    volumes:
      - ./scripts/flyway-entrypoint.sh:/flyway-entrypoint.sh:ro
      - ./db/migrations:/flyway/migrations:ro
    depends_on:
      postgres: 
        condition: service_healthy
    networks:
      - expenses-net

networks:
  expenses-net:
    name: expenses-net

secrets:
  pg_user_password:
    file: ./secrets/pg-user-password.txt

volumes:
  pg_exp_data:


