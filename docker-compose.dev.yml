services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: runtime
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./src:/app/src
    environment:
      DB_PG_HOST: postgres
    env_file:
      - ./.env
    command: >
      uvicorn
      expenses_tracker_api.main:app
      --host 0.0.0.0
      --port "${APP_PORT}"
      --reload
      --reload-dir /app/src/expenses_tracker_api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - expenses-net
  
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: test
    environment:
      DB_PG_HOST: postgres
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - expenses-net

  postgres:
    image: postgres:16-alpine
    container_name: pg-expenses-tracker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PG_USER}
      POSTGRES_PASSWORD: ${DB_PG_USER_PASSWORD}
      POSTGRES_DB: ${DB_PG_DB_NAME}
    env_file:
      - ./.env
    volumes:
      - pg_exp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PG_USER} -d ${DB_PG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - expenses-net
    ports:
      - "${DB_PG_PORT}:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: migrate
    environment:
      DB_PG_HOST: postgres
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expenses-net

networks:
  expenses-net:
    name: expenses-net

volumes:
  pg_exp_data:


